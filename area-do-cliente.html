<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área do Cliente - Evento360</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f6f8;color:#171717;min-height:100vh}
header{background:#111;min-height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 7%;color:#fff}
.brand{font-size:25px;font-weight:800;letter-spacing:-.5px}.brand span{color:#ffd400}
.header-right{display:flex;align-items:center;gap:18px;font-size:14px}.email{opacity:.8}
button{font:inherit;cursor:pointer;border:0}.logout{background:#ffd400;color:#111;font-weight:700;border-radius:9px;padding:10px 16px}
main{width:min(1080px,92%);margin:42px auto 70px}
.login-card,.area{background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.07)}
.login-card{max-width:450px;margin:55px auto;padding:34px}.login-card h1{margin:0 0 8px;font-size:28px}.login-card p{margin:0 0 26px;color:#6d6d6d;line-height:1.5}
.field{margin-bottom:16px}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border:1px solid #ddd;border-radius:10px;font-size:15px;outline:none}.field input:focus{border-color:#ffd400;box-shadow:0 0 0 3px rgba(255,212,0,.16)}
.primary{width:100%;padding:13px;border-radius:10px;background:#ffd400;color:#111;font-weight:800}.secondary{width:100%;margin-top:12px;background:none;color:#555;font-size:14px}
.feedback{margin:0 0 16px;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.4}.error{background:#fff0f0;color:#a30000}.success{background:#effaf1;color:#18752b}
.hidden{display:none!important}
.area{padding:30px}.area-title{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:25px}.area-title h1{margin:0 0 6px;font-size:30px}.area-title p{margin:0;color:#777}
.refresh{background:#f0f1f3;border-radius:9px;padding:10px 14px;font-weight:700;color:#333}
.loading{text-align:center;padding:55px;color:#777}.empty{text-align:center;padding:60px 20px;color:#777}.empty strong{display:block;color:#333;font-size:18px;margin-bottom:7px}
.ticket-list{display:grid;gap:16px}.ticket{border:1px solid #e4e4e4;border-radius:15px;padding:20px;display:flex;justify-content:space-between;gap:25px;align-items:center}.ticket-main{min-width:0}.event{font-size:20px;font-weight:800;margin-bottom:9px}.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:#666;font-size:14px}.meta b{color:#333}.status{display:inline-flex;align-items:center;gap:7px;margin-top:14px;font-size:13px;font-weight:800;padding:7px 10px;border-radius:999px}.status.paid{background:#eaf8ee;color:#18752b}.status.pending{background:#fff7d6;color:#856900}.status.other{background:#f0f1f3;color:#555}.download{flex:0 0 auto;background:#ffd400;color:#111;border-radius:10px;padding:12px 17px;font-weight:800}.download.disabled{background:#eee;color:#999;cursor:not-allowed}
.print-ticket{position:fixed;left:-99999px;top:0;}
@media(max-width:650px){header{padding:0 4%;}.header-right .email{display:none}main{width:94%;margin-top:25px}.area{padding:20px}.area-title{display:block}.refresh{margin-top:15px}.ticket{display:block}.download{width:100%;margin-top:18px}.login-card{margin:25px auto;padding:25px}}
</style>
</head>
<body>
<header>
  <div class="brand">Evento<span>360</span></div>
  <div id="headerRight" class="header-right hidden">
    <span id="headerEmail" class="email"></span>
    <button id="logoutButton" class="logout" type="button">Sair</button>
  </div>
</header>

<main>
  <section id="loginCard" class="login-card hidden">
    <h1>Acesse sua conta</h1>
    <p>Entre para consultar seus ingressos.</p>
    <div id="loginFeedback" class="feedback hidden"></div>
    <div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" placeholder="seuemail@exemplo.com"></div>
    <div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" placeholder="Digite sua senha"></div>
    <button id="loginButton" class="primary" type="button">Entrar</button>
    <button id="forgotButton" class="secondary" type="button">Esqueci minha senha</button>
  </section>

  <section id="area" class="area hidden">
    <div class="area-title">
      <div><h1>Meus ingressos</h1><p>Consulte e baixe seus ingressos disponíveis.</p></div>
      <button id="refreshButton" class="refresh" type="button">Atualizar</button>
    </div>
    <div id="areaFeedback" class="feedback hidden"></div>
    <div id="ticketLoading" class="loading">Carregando seus ingressos...</div>
    <div id="empty" class="empty hidden"><strong>Nenhum ingresso encontrado</strong><span>Se você realizou uma compra recentemente, o ingresso aparecerá aqui após ser processado.</span></div>
    <div id="ticketList" class="ticket-list"></div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const firebaseConfig={
  apiKey:"AIzaSyAtxKBNFb700TssBLWuy5Peq5pSfbdeXsA",
  authDomain:"barebilheteria.firebaseapp.com",
  projectId:"barebilheteria",
  storageBucket:"barebilheteria.firebasestorage.app",
  messagingSenderId:"68126613293",
  appId:"1:68126613293:web:a1691b0fa4e50856097da4"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();
const storage=firebase.storage();

const loginCard=document.getElementById("loginCard");
const area=document.getElementById("area");
const headerRight=document.getElementById("headerRight");
const headerEmail=document.getElementById("headerEmail");
const email=document.getElementById("email");
const password=document.getElementById("password");
const loginButton=document.getElementById("loginButton");
const forgotButton=document.getElementById("forgotButton");
const logoutButton=document.getElementById("logoutButton");
const loginFeedback=document.getElementById("loginFeedback");
const areaFeedback=document.getElementById("areaFeedback");
const ticketLoading=document.getElementById("ticketLoading");
const ticketList=document.getElementById("ticketList");
const empty=document.getElementById("empty");
const refreshButton=document.getElementById("refreshButton");

function showFeedback(element,message,type="error"){
  element.textContent=message;
  element.className=`feedback ${type}`;
}
function hideFeedback(element){element.className="feedback hidden";element.textContent="";}
function escapeHtml(value){
  return String(value??"").replace(/[&<>'"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
}
function money(value){return Number(value||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function statusLabel(status){
  if(status==="PAID")return ["paid","Pagamento confirmado"];
  if(status==="AGUARDANDO_PAGAMENTO")return ["pending","Pagamento em processamento"];
  return ["other",status||"Aguardando processamento"];
}
async function carregarNomeCliente(user){
  try{
    const clienteDoc=await db.collection("CLIENTES").doc(user.uid).get();
    return clienteDoc.exists ? (clienteDoc.data().NOME || "") : "";
  }catch(error){
    console.error("[CLIENTE] Erro ao carregar nome:",error);
    return "";
  }
}

function gerarIngressoParaImpressao(ticket,nomeCliente){
  if(ticket.status!=="PAID") return;

  const workspace=String(ticket.workspace||"");
  const codigoEvento=String(ticket.codigoEvento||"");
  const codigo=String(ticket.CODIGO||"");

  if(!workspace || !codigoEvento || !codigo){
    showFeedback(areaFeedback,"Os dados do ingresso ainda não estão completos. Tente novamente.");
    return;
  }

  const numeroIngresso=ticket.numeroIngresso ? `Ingresso ${ticket.numeroIngresso}` : "Ingresso";
  const valor=money(ticket.precoIngresso);
  const emitidoEm=new Date().toLocaleString("pt-BR");
  const qrPayload=`${workspace}|${codigoEvento}|${codigo}`;

  const janela=window.open("","_blank","width=500,height=850");
  if(!janela){
    showFeedback(areaFeedback,"Permita a abertura de janelas para gerar o ingresso.");
    return;
  }

  const html=`<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ingresso - ${escapeHtml(ticket.nomeEvento||"Evento")}</title>
<style>
@page{size:80mm auto;margin:0}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#000}
body{width:80mm;padding:4mm}
.ticket{width:72mm;border:1px solid #000;border-radius:10px;overflow:hidden;background:#fff}
.header{text-align:center;padding:10px 8px 4px}
.brand{font-size:24px;font-weight:800;letter-spacing:-.5px}.brand span{color:#d1a300}
.evento{text-align:center;padding:4px 10px 12px;border-bottom:2px dashed #000}
.evento h2{margin:4px 0 8px;font-size:20px;line-height:1.2;word-break:break-word}
.event-code{font-size:12px;font-weight:bold;margin-top:5px}
.faixa{margin:12px auto 0;padding:7px 8px;border:1px solid #000;border-radius:8px;font-size:12px;font-weight:bold}
.bloco{padding:14px 10px}
.linha{display:flex;justify-content:space-between;gap:12px;margin-bottom:9px;font-size:13px}.label{font-weight:bold}.valor{font-weight:bold;text-align:right;word-break:break-word}
.total{background:#fff;padding:10px;border-radius:12px;margin-top:10px;border:1px solid #ddd}.totalValor{font-size:20px;font-weight:bold}
.identificacao{border-top:2px dashed #000;margin-top:16px;padding-top:16px;text-align:center}
.identificacao h3{margin:0 0 10px;font-size:16px}
#qrcode{display:flex;justify-content:center;margin:8px auto 10px}#qrcode img,#qrcode canvas{display:block;width:46mm!important;height:46mm!important}
.codigo{margin-top:10px;font-family:monospace;font-size:16px;font-weight:bold;letter-spacing:2px;word-break:break-all}
.info{margin-top:16px;font-size:12px;text-align:left}.info div{margin-bottom:6px}
.rodape{margin-top:16px;padding:12px 8px;border-top:2px dashed #000;text-align:center;font-size:10px}
.print-button{display:block;margin:18px auto 0;padding:10px 18px;border:0;border-radius:8px;background:#ffd400;font-weight:bold;cursor:pointer}
@media print{.print-button{display:none}body{padding:4mm}.ticket{width:72mm}}
</style>
</head>
<body>
<div class="ticket">
  <div class="header"><div class="brand">Evento<span>360</span></div></div>
  <div class="evento">
    <h2>${escapeHtml(ticket.nomeEvento||"Evento")}</h2>
    <div class="event-code">Código do evento: ${escapeHtml(codigoEvento)}</div>
    <div class="event-code">${escapeHtml(numeroIngresso)}</div>
    <div class="faixa">ACESSO CONFERIDO</div>
  </div>
  <div class="bloco">
    <div class="linha"><span class="label">Cliente</span><span class="valor">${escapeHtml(nomeCliente||ticket.nomeCliente||"-")}</span></div>
    <div class="linha"><span class="label">Valor</span><span class="valor">${escapeHtml(valor)}</span></div>
    <div class="total"><div class="linha" style="margin:0"><span class="label">Total</span><span class="totalValor">${escapeHtml(valor)}</span></div></div>
    <div class="identificacao">
      <h3>QR Code</h3>
      <div id="qrcode"></div>
      <div class="codigo">${escapeHtml(codigo)}</div>
      <div class="info">
        <div><b>Tipo do ingresso:</b> QR Code</div>
        <div><b>Emitido em:</b> ${escapeHtml(emitidoEm)}</div>
      </div>
      <div class="rodape">Ingresso pessoal e intransferível.</div>
    </div>
  </div>
</div>
<button class="print-button" onclick="window.print()">Imprimir ingresso</button>
<script>
new QRCode(document.getElementById("qrcode"),{
  text:${JSON.stringify(qrPayload)},
  width:180,
  height:180,
  correctLevel:QRCode.CorrectLevel.M
});
window.onload=function(){setTimeout(function(){window.print()},400)};
<\/script>
</body>
</html>`;

  janela.document.open();
  janela.document.write(html);
  janela.document.close();
}


async function validarPagamentosCliente() {
  const user = auth.currentUser;

  if (!user) {
    return;
  }

  try {
    const idToken = await user.getIdToken(true);

    const response = await fetch(
      "https://southamerica-east1-barebilheteria.cloudfunctions.net/validarIngressosCliente",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${idToken}`
        },
        body: JSON.stringify({})
      }
    );

    const dados = await response.json();

    if (!response.ok || !dados.sucesso) {
      console.error(
        "[CLIENTE] Erro ao validar pagamentos:",
        dados
      );
      return;
    }

    console.log(
      "[CLIENTE] Pagamentos validados:",
      dados.pagos
    );

  } catch (error) {
    console.error(
      "[CLIENTE] Erro ao chamar validação:",
      error
    );
  }
}
async function carregarIngressos(user){
  ticketLoading.classList.remove("hidden");
  ticketList.innerHTML="";
  empty.classList.add("hidden");
  hideFeedback(areaFeedback);
  try{
    await validarPagamentosCliente();
    const [clienteDoc,snapshot]=await Promise.all([
      db.collection("CLIENTES").doc(user.uid).get(),
      db.collection("CLIENTES").doc(user.uid).collection("REGISTROSINGRESSOSDOCLIENTE").get()
    ]);
    const nomeCliente=clienteDoc.exists ? (clienteDoc.data().NOME || "") : "";
    const ingressos=[];
    snapshot.forEach(doc=>ingressos.push({id:doc.id,...doc.data(),nomeCliente}));
    ingressos.sort((a,b)=>{
      const ta=a.ingressoCriadoEm?.toMillis?a.ingressoCriadoEm.toMillis():0;
      const tb=b.ingressoCriadoEm?.toMillis?b.ingressoCriadoEm.toMillis():0;
      return tb-ta;
    });
    ticketLoading.classList.add("hidden");
    if(!ingressos.length){empty.classList.remove("hidden");return;}
    ticketList.innerHTML=ingressos.map(ticket=>{
      const [statusClass,statusText]=statusLabel(ticket.status);
      const numero=ticket.numeroIngresso?`Ingresso ${ticket.numeroIngresso}`:"Ingresso";
      const button=ticket.status==="PAID"
        ? `<button class="download" data-id="${escapeHtml(ticket.id)}" type="button">Gerar ingresso</button>`
        : `<button class="download disabled" type="button" disabled>${ticket.status==="AGUARDANDO_PAGAMENTO"?"Aguardando pagamento":"Indisponível"}</button>`;
      return `<article class="ticket">
        <div class="ticket-main">
          <div class="event">${escapeHtml(ticket.nomeEvento||"Evento")}</div>
          <div class="meta"><span><b>${escapeHtml(numero)}</b></span><span>Código do evento: <b>${escapeHtml(ticket.codigoEvento||"-")}</b></span><span>Valor: <b>${money(ticket.precoIngresso)}</b></span></div>
          <div class="status ${statusClass}">${escapeHtml(statusText)}</div>
        </div>${button}
      </article>`;
    }).join("");
    ticketList.querySelectorAll("button[data-id]").forEach(button=>button.addEventListener("click",()=>{
      const ticket=ingressos.find(item=>item.id===button.dataset.id);if(ticket)gerarIngressoParaImpressao(ticket,nomeCliente);
    }));
  }catch(error){
    console.error("[CLIENTE] Erro ao carregar ingressos:",error);
    ticketLoading.classList.add("hidden");
    showFeedback(areaFeedback,"Não foi possível carregar seus ingressos.");
  }
}
loginButton.addEventListener("click",async()=>{
  hideFeedback(loginFeedback);
  const emailValue=email.value.trim().toLowerCase();
  const passwordValue=password.value;
  if(!emailValue||!passwordValue){showFeedback(loginFeedback,"Informe seu e-mail e sua senha.");return;}
  loginButton.disabled=true;loginButton.textContent="Entrando...";
  try{await auth.signInWithEmailAndPassword(emailValue,passwordValue);}
  catch(error){
    console.error(error);
    let message="Não foi possível entrar. Verifique seu e-mail e sua senha.";
    if(error.code==="auth/user-not-found"||error.code==="auth/invalid-credential")message="E-mail ou senha incorretos.";
    if(error.code==="auth/too-many-requests")message="Muitas tentativas. Tente novamente mais tarde.";
    showFeedback(loginFeedback,message);
  }finally{loginButton.disabled=false;loginButton.textContent="Entrar";}
});
forgotButton.addEventListener("click",async()=>{
  hideFeedback(loginFeedback);const emailValue=email.value.trim().toLowerCase();
  if(!emailValue){showFeedback(loginFeedback,"Informe seu e-mail para receber o link de recuperação.");return;}
  try{await auth.sendPasswordResetEmail(emailValue);showFeedback(loginFeedback,"Enviamos um link para redefinir sua senha.","success");}
  catch(error){console.error(error);showFeedback(loginFeedback,"Não foi possível enviar o link de recuperação. Verifique o e-mail informado.");}
});
logoutButton.addEventListener("click",()=>auth.signOut());
  refreshButton.addEventListener("click", async () => {
  if (!auth.currentUser) {
    return;
  }

  refreshButton.disabled = true;
  refreshButton.textContent = "Atualizando...";

  try {
    await carregarIngressos(auth.currentUser);
  } catch (error) {
    console.error("[CLIENTE] Erro ao atualizar ingressos:", error);
  } finally {
    refreshButton.disabled = false;
    refreshButton.textContent = "Atualizar";
  }
});
auth.onAuthStateChanged(user=>{
  if(user){
    loginCard.classList.add("hidden");area.classList.remove("hidden");headerRight.classList.remove("hidden");headerEmail.textContent=user.email||"";carregarIngressos(user);
  }else{
    loginCard.classList.remove("hidden");area.classList.add("hidden");headerRight.classList.add("hidden");ticketList.innerHTML="";
  }
});
</script>
</body>
</html>
